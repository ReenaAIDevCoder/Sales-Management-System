{% extends "base.html" %}

{% block title %}
Edit Lead | Sales Management System
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Lead</h1>
        <p>Update lead information.</p>
    </div>

</div>


<div class="form-card">

    <form
        method="POST"
        action="{{ url_for(
            'lead.edit_lead',
            lead_id=lead.id
        ) }}"
    >

        <div class="form-row">

            <div class="form-group">

                <label for="name">
                    Lead Name *
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ lead.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="company">
                    Company
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    value="{{ lead.company or '' }}"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ lead.email or '' }}"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{ lead.phone or '' }}"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="source">
                    Lead Source
                </label>

                <select
                    id="source"
                    name="source"
                >

                    {% for source in [
                        "Website",
                        "Campaign",
                        "Referral",
                        "Social Media",
                        "Other"
                    ] %}

                    <option
                        value="{{ source }}"
                        {% if lead.source == source %}
                        selected
                        {% endif %}
                    >
                        {{ source }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="priority">
                    Priority
                </label>

                <select
                    id="priority"
                    name="priority"
                >

                    {% for priority in [
                        "High",
                        "Medium",
                        "Low"
                    ] %}

                    <option
                        value="{{ priority }}"
                        {% if lead.priority == priority %}
                        selected
                        {% endif %}
                    >
                        {{ priority }}
                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="estimated_value">
                    Estimated Value
                </label>

                <input
                    type="number"
                    id="estimated_value"
                    name="estimated_value"
                    min="0"
                    step="0.01"
                    value="{{ lead.estimated_value or 0 }}"
                >

            </div>


            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    {% for status in [
                        "New",
                        "Contacted",
                        "Qualified",
                        "Converted",
                        "Lost"
                    ] %}

                    <option
                        value="{{ status }}"
                        {% if lead.status == status %}
                        selected
                        {% endif %}
                    >
                        {{ status }}
                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Update Lead
            </button>

            <a
                href="{{ url_for(
                    'lead.list_leads'
                ) }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
