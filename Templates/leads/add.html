{% extends "base.html" %}

{% block title %}
Add Lead | Sales Management System
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Add Lead</h1>
        <p>Create a new sales lead.</p>
    </div>

</div>


<div class="form-card">

    <form
        method="POST"
        action="{{ url_for('lead.add_lead') }}"
    >

        <div class="form-row">

            <div class="form-group">

                <label for="name">
                    Lead Name *
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="company">
                    Company
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="source">
                    Lead Source
                </label>

                <select
                    id="source"
                    name="source"
                >

                    <option value="Website">
                        Website
                    </option>

                    <option value="Campaign">
                        Campaign
                    </option>

                    <option value="Referral">
                        Referral
                    </option>

                    <option value="Social Media">
                        Social Media
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="priority">
                    Priority
                </label>

                <select
                    id="priority"
                    name="priority"
                >

                    <option value="High">
                        High
                    </option>

                    <option value="Medium" selected>
                        Medium
                    </option>

                    <option value="Low">
                        Low
                    </option>

                </select>

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="estimated_value">
                    Estimated Value
                </label>

                <input
                    type="number"
                    id="estimated_value"
                    name="estimated_value"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option value="New">
                        New
                    </option>

                    <option value="Contacted">
                        Contacted
                    </option>

                    <option value="Qualified">
                        Qualified
                    </option>

                    <option value="Converted">
                        Converted
                    </option>

                    <option value="Lost">
                        Lost
                    </option>

                </select>

            </div>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Lead
            </button>

            <a
                href="{{ url_for('lead.list_leads') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
