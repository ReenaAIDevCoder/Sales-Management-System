{% extends "base.html" %}

{% block title %}
Edit Customer | Sales Management System
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Customer</h1>
        <p>Update customer information.</p>
    </div>

</div>


<div class="form-card">

    <form
        method="POST"
        action="{{ url_for(
            'customer.edit_customer',
            customer_id=customer.id
        ) }}"
    >

        <div class="form-row">

            <div class="form-group">

                <label for="name">
                    Customer Name *
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ customer.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="company">
                    Company
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    value="{{ customer.company or '' }}"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ customer.email or '' }}"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{ customer.phone or '' }}"
                >

            </div>

        </div>


        <div class="form-group">

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                name="address"
                value="{{ customer.address or '' }}"
            >

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    value="{{ customer.city or '' }}"
                >

            </div>


            <div class="form-group">

                <label for="state">
                    State
                </label>

                <input
                    type="text"
                    id="state"
                    name="state"
                    value="{{ customer.state or '' }}"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="country">
                    Country
                </label>

                <input
                    type="text"
                    id="country"
                    name="country"
                    value="{{ customer.country or '' }}"
                >

            </div>


            <div class="form-group">

                <label for="industry">
                    Industry
                </label>

                <input
                    type="text"
                    id="industry"
                    name="industry"
                    value="{{ customer.industry or '' }}"
                >

            </div>

        </div>


        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
            >

                <option
                    value="Active"
                    {% if customer.status == "Active" %}selected{% endif %}
                >
                    Active
                </option>

                <option
                    value="Inactive"
                    {% if customer.status == "Inactive" %}selected{% endif %}
                >
                    Inactive
                </option>

                <option
                    value="Prospect"
                    {% if customer.status == "Prospect" %}selected{% endif %}
                >
                    Prospect
                </option>

            </select>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Update Customer
            </button>

            <a
                href="{{ url_for(
                    'customer.customer_detail',
                    customer_id=customer.id
                ) }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
