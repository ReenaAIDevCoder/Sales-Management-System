{% extends "base.html" %}

{% block title %}
Add Customer | Sales Management System
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Add Customer</h1>
        <p>Create a new customer contact.</p>
    </div>

</div>


<div class="form-card">

    <form
        method="POST"
        action="{{ url_for('customer.add_customer') }}"
    >

        <div class="form-row">

            <div class="form-group">

                <label for="name">
                    Customer Name *
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="company">
                    Company
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                >

            </div>

        </div>


        <div class="form-group">

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                name="address"
            >

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                >

            </div>


            <div class="form-group">

                <label for="state">
                    State
                </label>

                <input
                    type="text"
                    id="state"
                    name="state"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="country">
                    Country
                </label>

                <input
                    type="text"
                    id="country"
                    name="country"
                    value="India"
                >

            </div>


            <div class="form-group">

                <label for="industry">
                    Industry
                </label>

                <input
                    type="text"
                    id="industry"
                    name="industry"
                >

            </div>

        </div>


        <div class="form-group">

            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
            >

                <option value="Active">
                    Active
                </option>

                <option value="Inactive">
                    Inactive
                </option>

                <option value="Prospect">
                    Prospect
                </option>

            </select>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Customer
            </button>

            <a
                href="{{ url_for('customer.list_customers') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
